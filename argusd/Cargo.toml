[package]
name = "argusd"
version = "0.1.0"
edition = "2024"

[dependencies]
postcard = { version = "1.2.0", features = ["alloc"] }
rand = "0.10.4"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
